<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель - Cherry Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff2a75; --bg: #0a0508; --panel: #110a0d; --border: #2a1a22; }
        body { background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Боковое меню */
        .sidebar { width: 250px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 0; }
        .logo { padding: 0 20px 20px; font-size: 20px; font-weight: 900; border-bottom: 1px solid var(--border); }
        .logo span { color: var(--primary); }
        .nav-btn { padding: 15px 20px; color: #aaa; text-decoration: none; display: block; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.3s; border-left: 3px solid transparent; }
        .nav-btn:hover, .nav-btn.active { background: rgba(255, 42, 117, 0.1); color: var(--primary); border-left-color: var(--primary); }
        .bottom-link { margin-top: auto; padding: 20px; color: #888; text-decoration: none; font-size: 13px; }
        .bottom-link:hover { color: var(--primary); }

        /* Контент */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 28px; }
        
        /* Карточки */
        .stats-grid { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--panel); padding: 20px; border-radius: 10px; border: 1px solid var(--border); flex: 1; }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 12px; color: #888; }
        .stat-card p { margin: 0; font-size: 28px; font-weight: 900; color: #fff; }

        /* Таблицы и формы */
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: none; }
        .panel.active { display: block; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .data-table th, .data-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        .data-table th { color: #888; font-weight: 600; }
        
        /* Кнопки и инпуты */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .input-field { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box; font-family: 'Montserrat'; outline: none; }
        .input-field:focus { border-color: var(--primary); }
        
        .btn { padding: 10px 15px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; font-family: 'Montserrat'; font-size: 13px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #ff1a3c; }
        .btn-danger { background: #ff0022; color: #fff; }
        .btn-warning { background: #ffaa00; color: #000; }
        .btn-sm { padding: 6px 12px; font-size: 12px; margin-right: 5px; }

        /* Авторизация */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .login-box { background: var(--panel); padding: 40px; border-radius: 12px; border: 1px solid var(--border); width: 300px; text-align: center; }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: var(--primary);">Вход в Админку</h2>
            <input type="password" id="admin-pass" class="input-field" placeholder="Пароль" style="margin-bottom: 15px;">
            <button class="btn btn-primary" style="width: 100%;" onclick="login()">Войти</button>
        </div>
    </div>

    <!-- БОКОВОЕ МЕНЮ -->
    <div class="sidebar">
        <div class="logo">CHERRY <span>ADMIN</span></div>
        <a class="nav-btn active" onclick="switchTab('users', this)">👥 Пользователи</a>
        <a class="nav-btn" onclick="switchTab('settings', this)">⚙️ Настройки сайта</a>
        <a class="nav-btn" onclick="switchTab('promos', this)">🎁 Промокоды</a>
        <a href="index.html" class="bottom-link">← Вернуться на сайт</a>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="main-content">
        <div class="header">
            <h1 id="page-title">Управление пользователями</h1>
            <span id="admin-status" style="font-size: 12px; color: #888;">Вы: Админ</span>
        </div>

        <!-- ВКЛАДКА: ПОЛЬЗОВАТЕЛИ -->
        <div id="tab-users" class="panel active">
            <div class="stats-grid">
                <div class="stat-card"><h3>ВСЕГО ЮЗЕРОВ</h3><p id="stat-total">0</p></div>
                <div class="stat-card"><h3>PREMIUM</h3><p id="stat-premium" style="color: var(--primary);">0</p></div>
            </div>
            
            <input type="text" id="search-user" class="input-field" placeholder="Поиск по нику..." oninput="renderUsers()" style="margin-bottom: 20px;">
            
            <table class="data-table">
                <thead><tr><th>ID</th><th>Логин</th><th>Роль</th><th>Premium</th><th>Действия</th></tr></thead>
                <tbody id="users-table-body"></tbody>
            </table>
        </div>

        <!-- ВКЛАДКА: НАСТРОЙКИ -->
        <div id="tab-settings" class="panel">
            <div style="max-width: 500px;">
                <div class="input-group">
                    <label>Ссылка на скачивание клиента (.zip)</label>
                    <input type="text" id="set-download" class="input-field">
                </div>
                <div class="input-group">
                    <label>Счетчик онлайна (текст на главной)</label>
                    <input type="text" id="set-online" class="input-field">
                </div>
                <div class="input-group">
                    <label>Режим тех. работ (1 - вкл, 0 - выкл)</label>
                    <input type="number" id="set-maintenance" class="input-field">
                </div>
                <button class="btn btn-primary" onclick="saveSettings()">Сохранить настройки</button>
            </div>
        </div>

        <!-- ВКЛАДКА: ПРОМОКОДЫ -->
        <div id="tab-promos" class="panel">
            <div style="display: flex; gap: 20px;">
                <div style="flex: 1; background: #150a10; padding: 20px; border-radius: 10px; border: 1px solid var(--border);">
                    <h3>Создать промокод</h3>
                    <div class="input-group"><label>Код (например, CHERRY10)</label><input type="text" id="promo-code" class="input-field"></div>
                    <div class="input-group"><label>Скидка (%)</label><input type="number" id="promo-discount" class="input-field" value="10"></div>
                    <div class="input-group"><label>Кол-во активаций</label><input type="number" id="promo-uses" class="input-field" value="100"></div>
                    <button class="btn btn-primary" onclick="createPromo()">Создать</button>
                </div>
                <div style="flex: 2;">
                    <table class="data-table">
                        <thead><tr><th>Код</th><th>Скидка</th><th>Осталось</th></tr></thead>
                        <tbody id="promos-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ВСТАВЬ СЮДА ССЫЛКУ НА ТВОЙ ВОРКЕР (тот что заканчивается на .workers.dev)
        const API_URL = 'https://cherry-tg-bridge-v2.probati670.workers.dev';
        let adminPassword = '';

        // Логин
        async function login() {
            const pass = document.getElementById('admin-pass').value;
            // Проверяем пароль запросом к базе
            try {
                const res = await fetch(`${API_URL}/api/admin/users`, {
                    headers: { 'Authorization': `Bearer ${pass}` }
                });
                if (res.ok) {
                    adminPassword = pass;
                    document.getElementById('login-screen').style.display = 'none';
                    loadUsers();
                    loadSettings();
                    loadPromos();
                } else {
                    alert('Неверный пароль!');
                }
            } catch (e) {
                alert('Ошибка соединения с сервером');
            }
        }

        // Переключение вкладок
        function switchTab(tabId, el) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            el.classList.add('active');
            
            const titles = { users: 'Управление пользователями', settings: 'Настройки сайта', promos: 'Промокоды' };
            document.getElementById('page-title').innerText = titles[tabId];
        }

        // --- ПОЛЬЗОВАТЕЛИ ---
        let allUsers = [];

        async function loadUsers() {
            const res = await fetch(`${API_URL}/api/admin/users`, { headers: { 'Authorization': `Bearer ${adminPassword}` } });
            allUsers = await res.json();
            renderUsers();
        }

        function renderUsers() {
            const search = document.getElementById('search-user').value.toLowerCase();
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';
            
            let premiumCount = 0;
            const filtered = allUsers.filter(u => u.username.toLowerCase().includes(search));

            filtered.forEach(user => {
                if (user.is_premium) premiumCount++;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${user.id}</td>
                    <td>${user.username}</td>
                    <td><span style="color: ${user.role === 'admin' ? '#ffaa00' : '#fff'}">${user.role}</span></td>
                    <td>${user.is_premium ? '<span style="color: #ff2a75; font-weight: bold;">Premium</span>' : 'Free'}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="togglePremium(${user.id}, ${user.is_premium})">${user.is_premium ? 'Снять Premium' : 'Выдать Premium'}</button>
                        <button class="btn btn-primary btn-sm" onclick="resetPass(${user.id})">Сброс пароля</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})">Удалить</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            document.getElementById('stat-total').innerText = allUsers.length;
            document.getElementById('stat-premium').innerText = premiumCount;
        }

        async function togglePremium(id, currentStatus) {
            const newStatus = currentStatus ? 0 : 1;
            await fetch(`${API_URL}/api/admin/users/${id}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${adminPassword}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_premium: newStatus })
            });
            loadUsers();
        }

        async function resetPass(id) {
            const newPass = prompt("Введите новый пароль для пользователя:");
            if (!newPass) return;
            await fetch(`${API_URL}/api/admin/users/${id}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${adminPassword}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: newPass })
            });
            alert("Пароль изменен!");
        }

        // --- НАСТРОЙКИ ---
        async function loadSettings() {
            const res = await fetch(`${API_URL}/api/settings`);
            const data = await res.json();
            document.getElementById('set-download').value = data.download_link || '';
            document.getElementById('set-online').value = data.online_counter || '';
            document.getElementById('set-maintenance').value = data.maintenance || '0';
        }

        async function saveSettings() {
            const data = {
                download_link: document.getElementById('set-download').value,
                online_counter: document.getElementById('set-online').value,
                maintenance: document.getElementById('set-maintenance').value
            };
            await fetch(`${API_URL}/api/admin/settings`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${adminPassword}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            alert('Настройки сохранены!');
        }

        // --- ПРОМОКОДЫ ---
        async function loadPromos() {
            const res = await fetch(`${API_URL}/api/admin/promos`, { headers: { 'Authorization': `Bearer ${adminPassword}` } });
            const promos = await res.json();
            const tbody = document.getElementById('promos-table-body');
            tbody.innerHTML = '';
            promos.forEach(p => {
                tbody.innerHTML += `<tr><td>${p.code}</td><td>${p.discount}%</td><td>${p.uses_left} / ${p.max_uses}</td></tr>`;
            });
        }

        async function createPromo() {
            const code = document.getElementById('promo-code').value.toUpperCase();
            const discount = parseInt(document.getElementById('promo-discount').value);
            const uses = parseInt(document.getElementById('promo-uses').value);
            if (!code) return alert("Введите код!");

            await fetch(`${API_URL}/api/admin/promo`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${adminPassword}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, discount, max_uses: uses })
            });
            document.getElementById('promo-code').value = '';
            loadPromos();
        }
    </script>
</body>
</html>
