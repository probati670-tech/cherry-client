<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель - Cherry Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff2a75; --primary-light: #ff7eb3; --bg-color: #0a0508; 
            --card-bg: rgba(20, 10, 15, 0.6); --border-color: rgba(255, 42, 117, 0.2);
            --success: #4CAF50; --danger: #ff4d4d; --warning: #ff9800;
        }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-color); color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; display: flex; }

        /* Сайдбар */
        .sidebar { width: 260px; background: rgba(15, 5, 10, 0.85); backdrop-filter: blur(15px); border-right: 1px solid var(--border-color); padding: 30px 20px; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; text-decoration: none; color: #fff; margin-bottom: 40px; display: block; text-align: center; }
        .logo span { color: var(--primary); }
        
        .nav-menu { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-radius: 12px; color: #aaa; text-decoration: none; font-weight: 600; font-size: 15px; transition: 0.3s; cursor: pointer; border: 1px solid transparent; }
        .nav-item:hover, .nav-item.active { background: rgba(255, 42, 117, 0.1); color: var(--primary-light); border-color: rgba(255, 42, 117, 0.3); }
        .logout-btn { margin-top: auto; color: var(--danger); }
        .logout-btn:hover { background: rgba(255, 77, 77, 0.1); color: var(--danger); border-color: rgba(255, 77, 77, 0.3); }

        /* Контент */
        .main-content { margin-left: 260px; padding: 40px; flex: 1; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .page-header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .page-header h1 { font-size: 32px; margin: 0; }
        
        /* Статистика */
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; }
        .stat-card h3 { color: #888; font-size: 13px; margin: 0 0 10px 0; text-transform: uppercase; }
        .stat-card .value { font-size: 32px; font-weight: 900; color: #fff; }
        .stat-card .value.pink { color: var(--primary-light); }

        /* Таблицы */
        .table-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; overflow-x: auto; }
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th { text-align: left; padding: 15px; color: #888; font-size: 13px; border-bottom: 1px solid var(--border-color); }
        .admin-table td { padding: 15px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .badge-admin { background: rgba(255, 152, 0, 0.2); color: var(--warning); }
        .badge-user { background: rgba(255,255,255,0.1); color: #aaa; }
        .badge-premium { background: rgba(255, 42, 117, 0.2); color: var(--primary-light); border: 1px solid var(--primary); }
        .badge-free { background: rgba(255,255,255,0.05); color: #666; }
        .badge-banned { background: rgba(255, 77, 77, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .badge-success { background: rgba(76, 175, 80, 0.2); color: var(--success); }

        /* Префиксы */
        .prefix-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 900; font-size: 10px; text-transform: uppercase; margin-left: 5px; }
        .prefix-vip { background: linear-gradient(45deg, #FFD700, #FFA500); color: #000; }
        .prefix-god { background: linear-gradient(45deg, #ff2a75, #ff7eb3); color: #fff; }
        .prefix-dev { background: linear-gradient(45deg, #00bfff, #1e90ff); color: #fff; }
        .prefix-cherry { background: linear-gradient(45deg, #ff0000, #8b0000); color: #fff; }

        /* Кнопки действий */
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: 'Montserrat'; font-weight: 600; font-size: 12px; transition: 0.3s; border: 1px solid transparent; }
        .btn-edit { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.1); }
        .btn-edit:hover { background: var(--primary); border-color: var(--primary); }
        .btn-ban { background: rgba(255, 152, 0, 0.1); color: var(--warning); border-color: rgba(255, 152, 0, 0.3); }
        .btn-ban:hover { background: var(--warning); color: black; }
        .btn-del { background: rgba(255, 77, 77, 0.1); color: var(--danger); border-color: rgba(255, 77, 77, 0.3); }
        .btn-del:hover { background: var(--danger); color: white; }

        /* Модалки */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 2, 3, 0.9); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: #110a0d; border: 1px solid var(--primary); border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; }
        .modal-content h2 { margin-top: 0; color: var(--primary-light); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 12px; background: #0a0508; border: 1px solid #331a22; color: white; border-radius: 8px; font-family: 'Montserrat'; outline: none; }
        .form-control:focus { border-color: var(--primary); }
        .btn-save { width: 100%; padding: 14px; background: linear-gradient(45deg, var(--primary), var(--primary-light)); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 10px; font-family: 'Montserrat'; }
    </style>
</head>
<body>

    <!-- САЙДБАР -->
    <div class="sidebar">
        <a href="index.html" class="logo">CHERRY <span>ADMIN</span></a>
        <div class="nav-menu">
            <a class="nav-item active" onclick="switchTab('users', this)"><i>👥</i> Пользователи</a>
            <a href="index.html" class="nav-item logout-btn"><i>🚪</i> На сайт</a>
        </div>
    </div>

    <!-- КОНТЕНТ -->
    <div class="main-content">
        <div id="tab-users" class="tab-content active">
            <div class="page-header">
                <h1>Управление пользователями</h1>
                <div style="color: #888; font-size: 14px;">Вы: <strong style="color: var(--primary-light);" id="current-admin-name">...</strong></div>
            </div>

            <div class="grid-stats">
                <div class="stat-card">
                    <h3>Всего юзеров</h3>
                    <div class="value" id="stat-total-users">0</div>
                </div>
                <div class="stat-card">
                    <h3>Premium</h3>
                    <div class="value pink" id="stat-premium-users">0</div>
                </div>
            </div>

            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Логин</th>
                            <th>Пароль</th>
                            <th>Роль</th>
                            <th>Подписка</th>
                            <th>Префикс</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h2>Редактировать: <span id="edit-username-display"></span></h2>
            
            <div class="form-group">
                <label>Роль</label>
                <select class="form-control" id="edit-role">
                    <option value="user">Пользователь</option>
                    <option value="admin">Администратор</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Подписка</label>
                <select class="form-control" id="edit-sub">
                    <option value="free">Бесплатная (Free)</option>
                    <option value="premium">Premium (Активна)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Выдать префикс (Титул)</label>
                <select class="form-control" id="edit-prefix">
                    <option value="">Без префикса</option>
                    <option value="vip">VIP</option>
                    <option value="dev">DEV</option>
                    <option value="god">GOD</option>
                    <option value="cherry">CHERRY</option>
                </select>
            </div>

            <button class="btn-save" onclick="saveUserChanges()">Сохранить</button>
            <button onclick="closeModals()" style="width:100%; background:none; border:none; color:#888; margin-top:15px; cursor:pointer; font-family:'Montserrat';">Отмена</button>
        </div>
    </div>

    <script>
        // Инициализация
        let defaultUsers = [
            { id: 1, name: "Test_Admin", role: "admin", sub: "premium", pass: "Test123456", status: "active", prefix: "cherry", ownedPrefixes: ["cherry"] },
            { id: 2, name: "Test_Manager", role: "user", sub: "free", pass: "Test12345", status: "active", prefix: "", ownedPrefixes: [] }
        ];
        
        let allUsers = JSON.parse(localStorage.getItem('cherry_all_users')) || defaultUsers;
        if(!localStorage.getItem('cherry_all_users')) {
            localStorage.setItem('cherry_all_users', JSON.stringify(defaultUsers));
        }

        let currentUser = localStorage.getItem('cherry_user');
        if (!currentUser) { alert("Доступ запрещен."); window.location.href = "index.html"; }
        
        let userObj = allUsers.find(u => u.name === currentUser);
        if (!userObj || userObj.role !== 'admin') { alert("Доступ запрещен."); window.location.href = "index.html"; }

        document.getElementById('current-admin-name').innerText = currentUser;
        let currentEditingUserId = null;

        function renderTable() {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';
            let premiumCount = 0;

            allUsers.forEach((user, index) => {
                if(user.sub === 'premium') premiumCount++;

                const roleBadge = user.role === 'admin' ? '<span class="badge badge-admin">Админ</span>' : '<span class="badge badge-user">Юзер</span>';
                const subBadge = user.sub === 'premium' ? '<span class="badge badge-premium">Premium</span>' : '<span class="badge badge-free">Free</span>';
                const statusBadge = user.status === 'banned' ? '<span class="badge badge-banned">Бан</span>' : '';
                
                // Отрисовка префикса в таблице
                let prefixHTML = '';
                if(user.prefix) {
                    prefixHTML = `<span class="prefix-badge prefix-${user.prefix}">${user.prefix}</span>`;
                } else {
                    prefixHTML = '<span style="color:#555;">—</span>';
                }

                const banBtn = user.status === 'banned' 
                    ? `<button class="btn-action btn-ban" onclick="toggleBan(${index})" style="color:#4CAF50; border-color:#4CAF50;">Разбан</button>`
                    : `<button class="btn-action btn-ban" onclick="toggleBan(${index})">Бан</button>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color:#666;">#${user.id}</td>
                    <td style="font-weight:600;">${user.name} ${prefixHTML}</td>
                    <td style="color:#ff9800; font-family:monospace;">${user.pass || '—'}</td>
                    <td>${roleBadge}</td>
                    <td>${subBadge} ${statusBadge}</td>
                    <td>${prefixHTML}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-action btn-edit" onclick="openEditModal(${index})">Изменить</button>
                            ${banBtn}
                            <button class="btn-action btn-del" onclick="deleteUser(${index})">Удалить</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('stat-total-users').innerText = allUsers.length;
            document.getElementById('stat-premium-users').innerText = premiumCount;
        }

        function openEditModal(index) {
            currentEditingUserId = index;
            const user = allUsers[index];
            document.getElementById('edit-username-display').innerText = user.name;
            document.getElementById('edit-role').value = user.role;
            document.getElementById('edit-sub').value = user.sub;
            document.getElementById('edit-prefix').value = user.prefix || '';
            document.getElementById('edit-modal').classList.add('active');
        }

        function saveUserChanges() {
            if(currentEditingUserId === null) return;
            const user = allUsers[currentEditingUserId];
            
            user.role = document.getElementById('edit-role').value;
            user.sub = document.getElementById('edit-sub').value;
            
            // Выдача префикса
            let newPrefix = document.getElementById('edit-prefix').value;
            user.prefix = newPrefix;
            
            // Добавляем в список купленных, чтобы юзер мог его надеть/снять в ЛК
            if (newPrefix && (!user.ownedPrefixes || !user.ownedPrefixes.includes(newPrefix))) {
                if (!user.ownedPrefixes) user.ownedPrefixes = [];
                user.ownedPrefixes.push(newPrefix);
            }

            localStorage.setItem('cherry_all_users', JSON.stringify(allUsers));
            closeModals();
            renderTable();
        }

        function toggleBan(index) {
            const user = allUsers[index];
            if (user.name === currentUser) { alert("Нельзя забанить себя!"); return; }
            user.status = (user.status === 'banned') ? 'active' : 'banned';
            localStorage.setItem('cherry_all_users', JSON.stringify(allUsers));
            renderTable();
        }

        function deleteUser(index) {
            const user = allUsers[index];
            if (user.name === currentUser) { alert("Нельзя удалить себя!"); return; }
            if (confirm(`Удалить пользователя ${user.name}?`)) {
                allUsers.splice(index, 1);
                localStorage.setItem('cherry_all_users', JSON.stringify(allUsers));
                renderTable();
            }
        }

        function closeModals() {
            document.getElementById('edit-modal').classList.remove('active');
            currentEditingUserId = null;
        }

        window.onload = renderTable;
    </script>
</body>
</html>
