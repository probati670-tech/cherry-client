<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Cherry Client</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #ff006e;
            --secondary: #ff4d00;
            --bg-dark: #0a0a0a;
            --bg-panel: rgba(17, 17, 17, 0.85);
            --text-main: #ffffff;
            --text-muted: #888888;
            --border: rgba(255, 255, 255, 0.1);
            --success: #00e676;
            --warning: #ffab00;
            --danger: #ff1744;
            --info: #2196f3;
            --ddnet-blue: #51a2da;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 50%, rgba(255, 0, 110, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 77, 0, 0.1) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
        }

        @keyframes bgFloat { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-5%, -5%); } }

        .sidebar {
            width: 260px;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            position: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .brand { padding: 25px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
        .brand-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 5px 20px rgba(255, 0, 110, 0.4); }
        .brand-text { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .menu { list-style: none; flex: 1; padding: 20px 15px; overflow-y: auto; }
        .menu-item { margin-bottom: 6px; }
        .menu-link { display: flex; align-items: center; padding: 13px 18px; color: var(--text-muted); text-decoration: none; border-radius: 12px; transition: all 0.3s; font-weight: 500; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-size: 14px; }
        .menu-link i { width: 22px; margin-right: 12px; font-size: 16px; }
        .menu-link:hover { background: rgba(255, 0, 110, 0.1); color: white; transform: translateX(5px); }
        .menu-link.active { background: linear-gradient(90deg, rgba(255, 0, 110, 0.2), transparent); color: var(--primary); border-left: 3px solid var(--primary); }

        .badge-count { margin-left: auto; background: var(--primary); color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }

        .user-profile-mini { padding: 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .mini-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #333, #555); display: flex; align-items: center; justify-content: center; font-size: 18px; border: 2px solid var(--border); overflow: hidden; }
        .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .mini-info { flex: 1; }
        .mini-info h4 { font-size: 14px; margin-bottom: 2px; }
        .mini-info p { font-size: 12px; color: var(--text-muted); }
        .logout { color: var(--text-muted); cursor: pointer; padding: 8px; border-radius: 8px; transition: all 0.3s; }
        .logout:hover { color: var(--danger); background: rgba(255, 23, 68, 0.1); }

        .main { margin-left: 260px; padding: 40px 50px; min-height: 100vh; }
        .page { display: none; animation: fadeIn 0.5s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .header { margin-bottom: 35px; }
        .header h1 { font-size: 32px; margin-bottom: 8px; background: linear-gradient(135deg, #fff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-muted); font-size: 14px; }

        .card { background: var(--bg-panel); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 25px; }
        .card-content { padding: 30px; }
        .section-title { font-size: 20px; margin-bottom: 8px; font-weight: 700; }
        .section-desc { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

        /* ===== ДРУЗЬЯ ===== */
        .friends-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .friends-stats { display: flex; gap: 20px; }
        .friend-stat { text-align: center; }
        .friend-stat-num { font-size: 24px; font-weight: bold; color: var(--primary); }
        .friend-stat-label { font-size: 12px; color: var(--text-muted); }

        .search-add-friends { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 200px; background: rgba(0,0,0,0.3); border: 2px solid var(--border); border-radius: 10px; padding: 12px 16px; color: white; font-size: 14px; outline: none; transition: all 0.3s; }
        .search-input:focus { border-color: var(--primary); }

        .friends-list { display: grid; gap: 12px; }

        .friend-item { display: flex; align-items: center; padding: 15px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px; transition: all 0.3s; }
        .friend-item:hover { border-color: rgba(255, 0, 110, 0.3); transform: translateX(5px); }
        .friend-item.loading { opacity: 0.5; pointer-events: none; }

        .friend-avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--ddnet-blue), #2d7cb8); display: flex; align-items: center; justify-content: center; font-size: 24px; margin-right: 15px; position: relative; flex-shrink: 0; color: white; font-weight: bold; }
        .friend-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

        .friend-status-indicator { position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bg-dark); }
        .friend-status-indicator.online { background: var(--success); box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite; }
        .friend-status-indicator.offline { background: var(--text-muted); }
        .friend-status-indicator.ingame { background: var(--info); box-shadow: 0 0 10px var(--info); }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .friend-info { flex: 1; }
        .friend-info h4 { font-size: 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .friend-info p { font-size: 13px; color: var(--text-muted); }

        .friend-stats-mini { display: flex; gap: 15px; margin-top: 5px; flex-wrap: wrap; }
        .friend-stat-mini { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        .friend-stat-mini i { color: var(--ddnet-blue); font-size: 10px; }
        .friend-stat-mini strong { color: var(--text-main); }

        .friend-actions { display: flex; gap: 8px; }
        .friend-btn { background: rgba(255,255,255,0.05); border: none; color: var(--text-muted); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .friend-btn:hover { background: rgba(255, 0, 110, 0.2); color: var(--primary); transform: scale(1.1); }
        .friend-btn.remove:hover { background: rgba(255, 23, 68, 0.2); color: var(--danger); }
        .friend-btn.refresh:hover { background: rgba(81, 162, 218, 0.2); color: var(--ddnet-blue); }

        .recent-finishes { margin-top: 10px; }
        .recent-finishes h5 { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .finish-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
        .finish-item:last-child { border-bottom: none; }
        .finish-map { color: var(--ddnet-blue); font-weight: 600; }
        .finish-time { color: var(--success); font-family: monospace; }
        .finish-date { color: var(--text-muted); font-size: 11px; }

        .ddnet-badge { background: linear-gradient(135deg, var(--ddnet-blue), #2d7cb8); color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .points-badge { background: rgba(0, 230, 118, 0.15); color: var(--success); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .manual-badge { background: rgba(255, 171, 0, 0.15); color: var(--warning); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }

        .empty-friends { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-friends i { font-size: 60px; margin-bottom: 20px; opacity: 0.3; }

        /* ===== КНОПКИ ===== */
        .btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; padding: 14px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 0, 110, 0.4); }
        .btn:active { transform: translateY(0); }
        .btn-outline { background: transparent; border: 2px solid var(--border); }
        .btn-outline:hover { border-color: var(--primary); background: rgba(255, 0, 110, 0.1); }
        .btn-success { background: linear-gradient(135deg, #00e676, #00bfa5); }
        .btn-danger { background: linear-gradient(135deg, #ff1744, #d50000); }
        .btn-warning { background: linear-gradient(135deg, #ffab00, #ff8f00); }
        .btn-small { padding: 8px 16px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        /* ===== МОДАЛКА ===== */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-panel); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 40px; max-width: 500px; width: 90%; animation: modalPop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h3 { font-size: 24px; margin-bottom: 10px; }
        .modal p { color: var(--text-muted); margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; color: var(--text-muted); font-size: 13px; margin-bottom: 8px; font-weight: 600; }
        .form-input { width: 100%; background: rgba(0,0,0,0.3); border: 2px solid var(--border); border-radius: 10px; padding: 13px 16px; color: white; font-size: 14px; transition: all 0.3s; outline: none; }
        .form-input:focus { border-color: var(--primary); background: rgba(255, 0, 110, 0.05); }

        .add-mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .add-mode-tab { flex: 1; padding: 12px; background: rgba(0,0,0,0.3); border: 2px solid var(--border); border-radius: 10px; color: var(--text-muted); cursor: pointer; transition: all 0.3s; text-align: center; font-size: 13px; font-weight: 600; }
        .add-mode-tab:hover { border-color: var(--primary); color: white; }
        .add-mode-tab.active { border-color: var(--primary); background: rgba(255, 0, 110, 0.1); color: var(--primary); }

        .status-message { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; display: none; }
        .status-message.show { display: block; }
        .status-message.error { background: rgba(255, 23, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); }
        .status-message.success { background: rgba(0, 230, 118, 0.1); border: 1px solid var(--success); color: var(--success); }
        .status-message.info { background: rgba(33, 150, 243, 0.1); border: 1px solid var(--info); color: var(--info); }
        .status-message.warning { background: rgba(255, 171, 0, 0.1); border: 1px solid var(--warning); color: var(--warning); }

        .player-preview { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px; margin-bottom: 15px; display: none; }
        .player-preview.show { display: block; }
        .player-preview-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .player-preview-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--ddnet-blue), #2d7cb8); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .player-preview-name { font-size: 18px; font-weight: bold; }
        .player-preview-stats { display: flex; gap: 15px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); }
        .player-preview-stats span { display: flex; align-items: center; gap: 4px; }
        .player-preview-stats i { color: var(--ddnet-blue); }

        /* ===== TOAST ===== */
        .toast { position: fixed; bottom: 30px; right: 30px; background: var(--bg-panel); backdrop-filter: blur(20px); border-left: 4px solid var(--primary); padding: 18px 25px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; transform: translateX(400px); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .toast-content h4 { font-size: 14px; margin-bottom: 2px; }
        .toast-content p { font-size: 12px; color: var(--text-muted); }

        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .brand-text, .menu-link span, .mini-info, .badge-count { display: none; }
            .brand { justify-content: center; padding: 20px 0; }
            .menu-link { justify-content: center; padding: 15px 0; }
            .main { margin-left: 70px; padding: 20px; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">🍒</div>
            <span class="brand-text">CHERRY CLIENT</span>
        </div>
        <ul class="menu">
            <li class="menu-item"><a href="index.html" class="menu-link"><i class="fas fa-home"></i><span>На сайт</span></a></li>
            <li class="menu-item"><button class="menu-link active" data-page="friends"><i class="fas fa-users"></i><span>Друзья DDNet</span><span class="badge-count" id="friendsCount">0</span></button></li>
        </ul>
        <div class="user-profile-mini">
            <div class="mini-avatar" id="miniAvatar">👤</div>
            <div class="mini-info">
                <h4 id="miniName">Nick_Name</h4>
                <p>DDNet Player</p>
            </div>
            <i class="fas fa-sign-out-alt logout" onclick="logout()"></i>
        </div>
    </aside>

    <main class="main">
        <div class="page active" id="page-friends">
            <div class="header">
                <h1>Друзья DDNet</h1>
                <p>Добавляй друзей из DDNet или вручную по нику</p>
            </div>

            <div class="card">
                <div class="card-content">
                    <div class="friends-header">
                        <div class="friends-stats">
                            <div class="friend-stat">
                                <div class="friend-stat-num" id="totalFriends">0</div>
                                <div class="friend-stat-label">Всего друзей</div>
                            </div>
                            <div class="friend-stat">
                                <div class="friend-stat-num" id="onlineFriends" style="color: var(--success);">0</div>
                                <div class="friend-stat-label">Онлайн</div>
                            </div>
                            <div class="friend-stat">
                                <div class="friend-stat-num" id="totalPoints" style="color: var(--ddnet-blue);">0</div>
                                <div class="friend-stat-label">Общие очки</div>
                            </div>
                        </div>
                    </div>

                    <div class="search-add-friends">
                        <input type="text" class="search-input" id="friendSearch" placeholder="🔍 Поиск по нику..." oninput="filterFriends()">
                        <button class="btn" onclick="openAddFriendModal()"><i class="fas fa-user-plus"></i> Добавить друга</button>
                        <button class="btn btn-outline" onclick="refreshAllFriends()"><i class="fas fa-sync-alt"></i> Обновить</button>
                    </div>

                    <div class="friends-list" id="friendsList"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Модалка добавления друга -->
    <div class="modal" id="addFriendModal">
        <div class="modal-content">
            <h3>Добавить друга</h3>
            <p>Выбери способ добавления друга</p>

            <div class="add-mode-tabs">
                <div class="add-mode-tab active" data-mode="api" onclick="switchAddMode('api')">
                    <i class="fas fa-cloud"></i> Через DDNet API
                </div>
                <div class="add-mode-tab" data-mode="manual" onclick="switchAddMode('manual')">
                    <i class="fas fa-user"></i> Вручную
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Ник игрока</label>
                <input type="text" class="form-input" id="newFriendNick" placeholder="Введите ник..." oninput="onNickInput()">
            </div>

            <!-- Превью игрока (для API режима) -->
            <div class="player-preview" id="playerPreview">
                <div class="player-preview-header">
                    <div class="player-preview-avatar" id="previewAvatar">?</div>
                    <div>
                        <div class="player-preview-name" id="previewName">—</div>
                        <div style="font-size: 12px; color: var(--text-muted);" id="previewStatus">—</div>
                    </div>
                </div>
                <div class="player-preview-stats" id="previewStats"></div>
            </div>

            <div class="status-message" id="addFriendStatus"></div>

            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-outline" onclick="closeModal('addFriendModal')">Отмена</button>
                <button class="btn" id="confirmAddBtn" onclick="addFriend()"><i class="fas fa-user-plus"></i> Добавить</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <div class="toast-icon" id="toastIconBox"><i class="fas fa-check" id="toastIcon"></i></div>
        <div class="toast-content"><h4 id="toastTitle">Успешно!</h4><p id="toastMessage">Действие выполнено</p></div>
    </div>

    <script>
        const DDNET_API = 'https://ddnet.org/api';
        let currentAddMode = 'api';
        let currentPreviewData = null;
        let searchTimeout = null;

        let data = loadData();

        function loadData() {
            const saved = localStorage.getItem('cherryDDNetData');
            if (saved) {
                try { return JSON.parse(saved); } catch(e) {}
            }
            return {
                username: 'Nick_Name',
                friends: []
            };
        }

        function saveData() { localStorage.setItem('cherryDDNetData', JSON.stringify(data)); }

        // ===== НАВИГАЦИЯ =====
        document.querySelectorAll('.menu-link[data-page]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = link.getAttribute('data-page');
                document.querySelectorAll('.menu-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + page).classList.add('active');
                if (page === 'friends') renderFriends();
            });
        });

        window.addEventListener('load', () => {
            renderFriends();
            updateFriendsCount();
        });

        // ===== DDNET API =====
        async function fetchDDNetPlayer(nick) {
            try {
                const response = await fetch(`${DDNET_API}/players/${encodeURIComponent(nick)}.json`);
                if (response.status === 404) return { found: false, reason: 'not_found' };
                if (!response.ok) return { found: false, reason: 'api_error' };
                const jsonData = await response.json();
                
                // Проверяем структуру ответа DDNet API
                // API возвращает: { points: N, ranks: [...], finishes: [...] }
                // или { name: "...", points: N, ... }
                if (jsonData && (jsonData.points !== undefined || jsonData.name || jsonData.finishes)) {
                    return { found: true, data: jsonData };
                }
                return { found: false, reason: 'no_data' };
            } catch(e) {
                console.error('DDNet API error:', e);
                return { found: false, reason: 'network_error' };
            }
        }

        // ===== РЕЖИМЫ ДОБАВЛЕНИЯ =====
        function switchAddMode(mode) {
            currentAddMode = mode;
            document.querySelectorAll('.add-mode-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.add-mode-tab[data-mode="${mode}"]`).classList.add('active');
            
            document.getElementById('playerPreview').classList.remove('show');
            hideStatus();
            currentPreviewData = null;
            
            const nick = document.getElementById('newFriendNick').value.trim();
            if (nick) onNickInput();
        }

        function onNickInput() {
            const nick = document.getElementById('newFriendNick').value.trim();
            hideStatus();
            document.getElementById('playerPreview').classList.remove('show');
            currentPreviewData = null;

            if (!nick) return;

            if (currentAddMode === 'api') {
                // Debounce для API запроса
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => searchPlayer(nick), 500);
            }
        }

        async function searchPlayer(nick) {
            const btn = document.getElementById('confirmAddBtn');
            btn.disabled = true;
            showStatus('info', '⏳ Поиск игрока в DDNet...');

            const result = await fetchDDNetPlayer(nick);

            if (result.found) {
                currentPreviewData = result.data;
                showPlayerPreview(nick, result.data);
                showStatus('success', `✅ Игрок найден! Очки: ${result.data.points || 0}, Финишей: ${(result.data.finishes || []).length}`);
                btn.disabled = false;
            } else {
                currentPreviewData = null;
                document.getElementById('playerPreview').classList.remove('show');
                
                let msg = '❌ Игрок не найден в DDNet.';
                if (result.reason === 'not_found') {
                    msg = '❌ Игрок не найден в базе DDNet (нет завершённых карт). Попробуй добавить вручную.';
                } else if (result.reason === 'network_error') {
                    msg = '⚠️ Ошибка сети. Попробуй добавить вручную.';
                } else if (result.reason === 'api_error') {
                    msg = '⚠️ Ошибка API DDNet. Попробуй добавить вручную.';
                } else if (result.reason === 'no_data') {
                    msg = '⚠️ Игрок есть, но без данных. Попробуй добавить вручную.';
                }
                showStatus('warning', msg);
                btn.disabled = false;
            }
        }

        function showPlayerPreview(nick, playerData) {
            const preview = document.getElementById('playerPreview');
            document.getElementById('previewAvatar').textContent = nick.charAt(0).toUpperCase();
            document.getElementById('previewName').textContent = nick;
            
            const points = playerData.points || 0;
            const ranks = (playerData.ranks || []).length;
            const finishes = (playerData.finishes || []).length;
            const lastSeen = playerData.last_seen;
            
            let statusText = 'Статус неизвестен';
            if (lastSeen) {
                const lastTime = new Date(lastSeen).getTime();
                const diff = Date.now() - lastTime;
                if (diff < 3600000) statusText = '🟢 Онлайн';
                else if (diff < 86400000) statusText = '🟡 Был недавно';
                else statusText = '⚫ Оффлайн';
            }
            document.getElementById('previewStatus').textContent = statusText;

            document.getElementById('previewStats').innerHTML = `
                <span><i class="fas fa-star"></i> Очки: <strong style="color: var(--success);">${points.toLocaleString()}</strong></span>
                <span><i class="fas fa-trophy"></i> Рангов: <strong>${ranks}</strong></span>
                <span><i class="fas fa-flag-checkered"></i> Финишей: <strong>${finishes}</strong></span>
            `;

            preview.classList.add('show');
        }

        // ===== ДОБАВЛЕНИЕ ДРУГА =====
        async function addFriend() {
            const nick = document.getElementById('newFriendNick').value.trim();
            
            if (!nick) {
                showStatus('error', '❌ Введите ник игрока');
                return;
            }

            if (data.friends.find(f => f.nick.toLowerCase() === nick.toLowerCase())) {
                showStatus('error', '❌ Этот игрок уже в списке друзей');
                return;
            }

            const btn = document.getElementById('confirmAddBtn');
            btn.disabled = true;

            let friendData = null;
            let source = 'manual';

            if (currentAddMode === 'api' && currentPreviewData) {
                friendData = currentPreviewData;
                source = 'api';
            } else if (currentAddMode === 'api') {
                // Пытаемся найти через API ещё раз
                showStatus('info', '⏳ Поиск в DDNet...');
                const result = await fetchDDNetPlayer(nick);
                if (result.found) {
                    friendData = result.data;
                    source = 'api';
                } else {
                    showStatus('warning', `⚠️ Игрок "${nick}" не найден в API DDNet. Добавляю вручную.`);
                    await new Promise(r => setTimeout(r, 1500));
                }
            }

            // Добавляем друга (с данными из API или без)
            const friend = {
                id: Date.now(),
                nick: nick,
                addedAt: Date.now(),
                source: source,
                data: friendData
            };

            data.friends.push(friend);
            saveData();

            showStatus('success', `✅ ${nick} добавлен в друзья!${source === 'manual' ? ' (вручную)' : ''}`);

            setTimeout(() => {
                closeModal('addFriendModal');
                renderFriends();
                updateFriendsCount();
                showToast('Друг добавлен', `${nick} теперь в вашем списке`);
            }, 1000);
        }

        // ===== ОТОБРАЖЕНИЕ ДРУЗЕЙ =====
        function renderFriends(filter = '') {
            const list = document.getElementById('friendsList');
            const filtered = data.friends.filter(f => f.nick.toLowerCase().includes(filter.toLowerCase()));
            
            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-friends">
                        <i class="fas fa-user-friends"></i>
                        <h3>Список друзей пуст</h3>
                        <p>Добавьте первого друга через кнопку выше!</p>
                    </div>
                `;
                updateFriendsStats();
                return;
            }

            list.innerHTML = filtered.map(f => {
                const d = f.data;
                const hasData = d && (d.points !== undefined || d.finishes);
                const points = hasData ? (d.points || 0) : 0;
                const ranks = hasData ? (d.ranks || []).length : 0;
                const finishes = hasData ? (d.finishes || []).length : 0;
                const lastSeen = hasData ? d.last_seen : null;
                
                let statusClass = 'offline';
                let statusText = '⚫ Оффлайн';
                if (lastSeen) {
                    const lastTime = new Date(lastSeen).getTime();
                    const diff = Date.now() - lastTime;
                    if (diff < 3600000) { statusClass = 'online'; statusText = '🟢 Онлайн'; }
                    else if (diff < 86400000) { statusClass = 'ingame'; statusText = '🟡 Был недавно'; }
                }

                const recentFinishes = hasData && d.finishes ? d.finishes.slice(0, 3) : [];
                const sourceBadge = f.source === 'api' ? '<span class="ddnet-badge">DDNet API</span>' : '<span class="manual-badge">Вручную</span>';
                
                return `
                    <div class="friend-item" id="friend-${f.id}">
                        <div class="friend-avatar">
                            ${f.avatar ? `<img src="${f.avatar}" alt="${f.nick}">` : f.nick.charAt(0).toUpperCase()}
                            <div class="friend-status-indicator ${statusClass}"></div>
                        </div>
                        <div class="friend-info">
                            <h4>${f.nick} ${sourceBadge}${points > 0 ? `<span class="points-badge">${points} pts</span>` : ''}</h4>
                            <p>${statusText}${lastSeen ? ' • Последний вход: ' + formatTimeAgo(lastSeen) : ''}</p>
                            ${hasData ? `
                                <div class="friend-stats-mini">
                                    <div class="friend-stat-mini"><i class="fas fa-trophy"></i> Рангов: <strong>${ranks}</strong></div>
                                    <div class="friend-stat-mini"><i class="fas fa-flag-checkered"></i> Финишей: <strong>${finishes}</strong></div>
                                </div>
                                ${recentFinishes.length > 0 ? `
                                    <div class="recent-finishes">
                                        <h5>Последние финиши</h5>
                                        ${recentFinishes.map(finish => `
                                            <div class="finish-item">
                                                <span class="finish-map">${finish.map}</span>
                                                <span class="finish-time">${formatTime(finish.time)}</span>
                                                <span class="finish-date">${formatDate(finish.timestamp)}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            ` : '<p style="font-size: 11px; color: var(--warning); margin-top: 5px;">⚠ Нет данных из API (добавлен вручную)</p>'}
                        </div>
                        <div class="friend-actions">
                            ${hasData ? `<button class="friend-btn refresh" onclick="refreshFriend(${f.id})" title="Обновить из API"><i class="fas fa-sync-alt"></i></button>` : `<button class="friend-btn refresh" onclick="tryFetchFriend(${f.id})" title="Попробовать найти в API"><i class="fas fa-search"></i></button>`}
                            <button class="friend-btn remove" onclick="removeFriend(${f.id})" title="Удалить"><i class="fas fa-user-minus"></i></button>
                        </div>
                    </div>
                `;
            }).join('');

            updateFriendsStats();
        }

        function updateFriendsStats() {
            const total = data.friends.length;
            const totalPoints = data.friends.reduce((sum, f) => sum + ((f.data?.points) || 0), 0);
            const online = data.friends.filter(f => {
                if (!f.data?.last_seen) return false;
                const diff = Date.now() - new Date(f.data.last_seen).getTime();
                return diff < 3600000;
            }).length;
            
            document.getElementById('totalFriends').textContent = total;
            document.getElementById('onlineFriends').textContent = online;
            document.getElementById('totalPoints').textContent = totalPoints.toLocaleString();
        }

        function updateFriendsCount() {
            const count = data.friends.length;
            const badge = document.getElementById('friendsCount');
            badge.textContent = count;
            badge.style.display = count > 0 ? 'inline' : 'none';
        }

        function filterFriends() { renderFriends(document.getElementById('friendSearch').value); }

        async function refreshFriend(id) {
            const friend = data.friends.find(f => f.id === id);
            if (!friend) return;
            
            const item = document.getElementById(`friend-${id}`);
            if (item) item.classList.add('loading');
            
            showStatusGlobal(`Обновление ${friend.nick}...`);
            const result = await fetchDDNetPlayer(friend.nick);
            
            if (result.found) {
                friend.data = result.data;
                friend.source = 'api';
                saveData();
                showToast('Обновлено', `Данные ${friend.nick} обновлены из API`);
            } else {
                showToast('Не найдено', `Игрок ${friend.nick} не найден в API`, 'error');
            }
            
            renderFriends();
        }

        async function tryFetchFriend(id) {
            const friend = data.friends.find(f => f.id === id);
            if (!friend) return;
            
            showToast('Поиск', `Ищем ${friend.nick} в DDNet API...`);
            const result = await fetchDDNetPlayer(friend.nick);
            
            if (result.found) {
                friend.data = result.data;
                friend.source = 'api';
                saveData();
                showToast('Найдено!', `Данные ${friend.nick} загружены из API`);
            } else {
                showToast('Не найдено', `${friend.nick} не имеет данных в API DDNet`, 'error');
            }
            
            renderFriends();
        }

        async function refreshAllFriends() {
            showToast('Обновление', 'Загрузка данных всех друзей...');
            let updated = 0;
            for (const friend of data.friends) {
                const result = await fetchDDNetPlayer(friend.nick);
                if (result.found) {
                    friend.data = result.data;
                    friend.source = 'api';
                    updated++;
                }
                await new Promise(r => setTimeout(r, 600));
            }
            saveData();
            renderFriends();
            showToast('Готово', `Обновлено: ${updated} из ${data.friends.length}`);
        }

        function removeFriend(id) {
            const friend = data.friends.find(f => f.id === id);
            if (friend && confirm(`Удалить ${friend.nick} из списка друзей?`)) {
                data.friends = data.friends.filter(f => f.id !== id);
                saveData();
                renderFriends();
                updateFriendsCount();
                showToast('Удалено', `${friend.nick} удалён из списка`);
            }
        }

        // ===== УТИЛИТЫ =====
        function openAddFriendModal() {
            document.getElementById('addFriendModal').classList.add('active');
            document.getElementById('newFriendNick').value = '';
            hideStatus();
            document.getElementById('playerPreview').classList.remove('show');
            document.getElementById('confirmAddBtn').disabled = false;
            currentPreviewData = null;
            currentAddMode = 'api';
            document.querySelectorAll('.add-mode-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.add-mode-tab[data-mode="api"]').classList.add('active');
            setTimeout(() => document.getElementById('newFriendNick').focus(), 100);
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function showStatus(type, message) {
            const el = document.getElementById('addFriendStatus');
            el.className = `status-message show ${type}`;
            el.innerHTML = message;
        }

        function hideStatus() {
            const el = document.getElementById('addFriendStatus');
            el.className = 'status-message';
            el.innerHTML = '';
        }

        function showStatusGlobal(msg) {
            showToast('Обновление', msg);
        }

        function formatTime(seconds) {
            if (!seconds) return '—';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 100);
            return `${mins}:${secs.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
        }

        function formatDate(timestamp) {
            if (!timestamp) return '—';
            const date = new Date(timestamp * 1000);
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function formatTimeAgo(timestamp) {
            if (!timestamp) return '—';
            const seconds = Math.floor((Date.now() - new Date(timestamp).getTime()) / 1000);
            if (seconds < 60) return 'только что';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} мин. назад`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ч. назад`;
            const days = Math.floor(hours / 24);
            return `${days} дн. назад`;
        }

        function showToast(title, message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            const icon = document.getElementById('toastIcon');
            const iconBox = document.getElementById('toastIconBox');
            if (type === 'error') {
                icon.className = 'fas fa-exclamation';
                iconBox.style.background = 'rgba(255, 23, 68, 0.2)';
                iconBox.style.color = 'var(--danger)';
                toast.style.borderLeftColor = 'var(--danger)';
            } else {
                icon.className = 'fas fa-check';
                iconBox.style.background = 'rgba(255, 0, 110, 0.2)';
                iconBox.style.color = 'var(--primary)';
                toast.style.borderLeftColor = 'var(--primary)';
            }
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function logout() {
            if (confirm('Выйти из аккаунта?')) {
                showToast('До свидания!', 'Вы вышли из аккаунта');
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            }
        }

        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
        });

        document.getElementById('newFriendNick').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addFriend();
        });
    </script>
</body>
</html>
