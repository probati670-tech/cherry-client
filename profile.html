<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет - Cherry Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff2a75; --primary-light: #ff7eb3; --bg: #0a0508; --panel: #110a0d; --border: #2a1a22; }
        body { background-color: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 60px; border-bottom: 1px solid var(--border); }
        .logo { font-size: 24px; font-weight: 900; text-decoration: none; color: white; } .logo span { color: var(--primary); }
        .menu { display: flex; gap: 30px; align-items: center; }
        .menu a { color: #aaa; text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.3s; }
        .menu a:hover { color: var(--primary-light); }
        
        .content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .profile-card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
        
        .avatar-large { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(45deg, var(--primary), var(--primary-light)); color: white; font-size: 40px; font-weight: 900; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; box-shadow: 0 0 30px rgba(255,42,117,0.4); }
        
        .username { font-size: 28px; font-weight: 900; margin-bottom: 5px; }
        .role-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 30px; text-transform: uppercase; }
        .role-admin { background: rgba(255, 152, 0, 0.2); color: #ff9800; border: 1px solid #ff9800; }
        .role-user { background: rgba(255, 255, 255, 0.1); color: #ccc; border: 1px solid #444; }
        
        .info-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .info-title { color: #888; font-size: 14px; }
        .info-value { font-size: 18px; font-weight: bold; }
        
        .premium-active { color: #ff2a75; text-shadow: 0 0 10px rgba(255,42,117,0.5); }
        .premium-free { color: #aaa; }
        
        .btn-logout { background: transparent; color: #ff0022; border: 1px solid #ff0022; padding: 12px 30px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; font-family: 'Montserrat', sans-serif; width: 100%; }
        .btn-logout:hover { background: rgba(255,0,34,0.1); }
        
        .btn-buy { background: linear-gradient(45deg, var(--primary), var(--primary-light)); color: white; border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; font-family: 'Montserrat', sans-serif; width: 100%; margin-bottom: 15px; text-decoration: none; display: block; box-sizing: border-box; }
        .btn-buy:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,42,117,0.4); }

        /* Футер */
        footer { background-color: #0a0508; border-top: 1px solid #22151a; padding: 40px 60px 20px; display: flex; flex-direction: column; gap: 30px; }
        .footer-top { display: flex; justify-content: space-between; max-width: 1200px; margin: 0 auto; width: 100%; }
        .tg-buttons { display: flex; gap: 15px; }
        .tg-btn { background: #110a0d; border: 1px solid #2a1a22; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; }
        .footer-bottom { border-top: 1px solid #22151a; padding-top: 20px; text-align: center; font-size: 12px; color: #555; display: flex; flex-direction: column; gap: 10px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .footer-bottom a { color: #888; text-decoration: none; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="index.html" class="logo">CHERRY <span>CLIENT</span></a>
        <div class="menu">
            <a href="index.html">Главная</a>
            <a href="download.html">Скачать</a>
            <a href="overview.html">Обзор</a>
            <a href="features.html">Документация</a>
            <a href="compare.html">Сравнение</a>
        </div>
    </div>

    <div class="content">
        <div class="profile-card">
            <div class="avatar-large" id="user-avatar">?</div>
            <div class="username" id="user-name">Загрузка...</div>
            <div class="role-badge role-user" id="user-role">Пользователь</div>
            
            <div class="info-box">
                <span class="info-title">Подписка</span>
                <span class="info-value premium-free" id="user-premium">Free</span>
            </div>

            <!-- Блок для покупки, показывается если не Premium -->
            <div id="premium-block" style="display: none;">
                <a href="download.html" class="btn-buy">👑 Купить Premium за 399 ₽</a>
            </div>

            <button class="btn-logout" onclick="logout()">Выйти из аккаунта</button>
        </div>
    </div>

    <footer>
        <div class="footer-top">
            <div class="footer-brand"><h3>CHERRY CLIENT</h3><p>Продвинутый клиент для DDNet</p></div>
            <div class="tg-buttons">
                <a href="https://t.me/cherryclient" target="_blank" class="tg-btn">✈️ Telegram</a>
                <a href="https://t.me/nexnayyy" target="_blank" class="tg-btn">🛠️ Поддержка</a>
            </div>
        </div>
        <div class="footer-bottom">
            <div><a href="privacy.html">Политика</a> • <a href="terms.html">Соглашение</a> • <a href="support.html">Поддержка</a></div>
            <div>© 2026 Cherry Client.</div>
        </div>
    </footer>

    <script>
        const API_URL = 'https://cherry-tg-bridge-v2.probati670.workers.dev';
        
        window.onload = async function() {
            const savedUser = localStorage.getItem('cherry_user');
            if(!savedUser) {
                window.location.href = 'index.html'; // Если не залогинен - на главную
                return;
            }

            document.getElementById('user-avatar').innerText = savedUser.charAt(0).toUpperCase();
            document.getElementById('user-name').innerText = savedUser;

            // Получаем актуальные данные из БД
            try {
                const res = await fetch(`${API_URL}/api/me?username=${savedUser}`);
                const data = await res.json();
                
                if(res.ok) {
                    // Роль
                    const roleBadge = document.getElementById('user-role');
                    if(data.role === 'admin') {
                        roleBadge.className = 'role-badge role-admin';
                        roleBadge.innerText = 'Администратор';
                    } else {
                        roleBadge.className = 'role-badge role-user';
                        roleBadge.innerText = 'Пользователь';
                    }

                    // Премиум
                    const premiumBadge = document.getElementById('user-premium');
                    if(data.is_premium === 1) {
                        premiumBadge.className = 'info-value premium-active';
                        premiumBadge.innerText = 'Premium активен';
                        document.getElementById('premium-block').style.display = 'none';
                    } else {
                        premiumBadge.className = 'info-value premium-free';
                        premiumBadge.innerText = 'Free версия';
                        document.getElementById('premium-block').style.display = 'block';
                    }
                }
            } catch(e) {
                console.error("Ошибка загрузки профиля");
            }
        };

        function logout() {
            localStorage.removeItem('cherry_user');
            localStorage.removeItem('cherry_role');
            localStorage.removeItem('cherry_premium');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
