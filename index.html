<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Cherry Client - DDNet</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0a0a0a; color: white; font-family: 'Montserrat', sans-serif;
            margin: 0; height: 100vh; display: flex; flex-direction: column;
        }
        /* --- Меню --- */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo { font-size: 24px; font-weight: 900; }
        .logo span { color: #ff0022; }
        .menu a { color: #ccc; text-decoration: none; margin-left: 30px; font-size: 14px; font-weight: 700; transition: 0.3s; cursor: pointer; }
        .menu a:hover { color: #ff0022; }

        /* --- Главный экран --- */
        .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 64px; font-weight: 900; margin: 0 0 10px 0; }
        .hero h1 span { color: #ff0022; }
        .hero p { color: #aaa; font-size: 18px; max-width: 600px; margin-bottom: 40px; }
        .buttons { display: flex; gap: 20px; }
        
        /* --- Кнопки --- */
        .btn {
            padding: 15px 35px; border-radius: 5px; text-decoration: none; font-weight: 700;
            font-size: 16px; transition: 0.3s; display: flex; align-items: center; gap: 10px; border: none; cursor: pointer; font-family: 'Montserrat', sans-serif;
        }
        .btn-primary { background-color: #ff0022; color: white; box-shadow: 0 0 15px rgba(255,0,34,0.3); }
        .btn-primary:hover { background-color: #ff1a3c; box-shadow: 0 0 25px rgba(255,0,34,0.6); transform: translateY(-2px); }
        .btn-secondary { background-color: #1a1a1a; color: white; border: 1px solid #333; }
        .btn-secondary:hover { background-color: #2a2a2a; border-color: #555; transform: translateY(-2px); }

        /* --- Счетчик --- */
        .online-counter { margin-top: 50px; border: 1px solid rgba(255,0,34,0.5); padding: 12px 30px; border-radius: 5px; font-family: monospace; font-size: 18px; color: #ff0022; background-color: rgba(255,0,34,0.05); }

        /* --- МОДАЛЬНОЕ ОКНО (ФОРМА ВХОДА) --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background-color: #111; padding: 40px; border-radius: 10px; border: 1px solid #333;
            width: 300px; text-align: center; box-shadow: 0 0 30px rgba(255,0,34,0.2);
        }
        .modal-content h2 { margin-top: 0; font-size: 24px; }
        .modal-content input {
            width: 90%; padding: 12px; margin: 10px 0; background-color: #222; border: 1px solid #444;
            color: white; border-radius: 5px; font-family: 'Montserrat', sans-serif;
        }
        .modal-content input:focus { outline: none; border-color: #ff0022; }
        .modal-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .close-btn { position: absolute; top: 10px; right: 15px; color: #aaa; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

    <!-- Меню -->
    <div class="navbar">
        <div class="logo">CHERRY <span>CLIENT</span></div>
        <div class="menu">
            <a href="#">Главная</a>
            <a id="login-link" onclick="openModal()">Вход / Регистрация</a>
        </div>
    </div>

    <!-- Главная часть -->
    <div class="hero">
        <h1>CHERRY <span>CLIENT</span></h1>
        <p>Продвинутый клиент для DDNet. Для скачивания необходимо войти в аккаунт.</p>
        
        <!-- Блок с кнопками -->
        <div class="buttons" id="download-area" style="display: none;">
            <a https://ddnet.org/downloads/ class="btn btn-primary">⬇ Скачать сейчас</a>
        </div>
        
        <!-- Заглушка, если не авторизован -->
        <div class="buttons" id="locked-area">
            <button class="btn btn-secondary" onclick="openModal()" style="opacity: 0.5; cursor: not-allowed;">🔒 Скачивание заблокировано</button>
        </div>

        <div class="online-counter">Сейчас играют: 8 ||</div>
    </div>

    <!-- Модальное окно входа -->
    <div class="modal" id="auth-modal">
        <div class="modal-content" style="position: relative;">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Вход</h2>
            <input type="text" id="username" placeholder="Логин">
            <input type="password" id="password" placeholder="Пароль">
            
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="login()" id="btn-action" style="justify-content: center;">Войти</button>
                <button class="btn btn-secondary" onclick="toggleMode()" id="btn-toggle" style="justify-content: center; font-size: 12px; padding: 10px;">Нет аккаунта? Зарегистрироваться</button>
            </div>
        </div>
    </div>

    <!-- Логика на JavaScript -->
    <script>
        let isLoginMode = true; // Режим: true = Вход, false = Регистрация

        // Проверяем, залогинен ли пользователь при загрузке страницы
        window.onload = function() {
            if(localStorage.getItem('cherry_user')) {
                unlockDownload();
            }
        };

        // Открыть и закрыть окно
        function openModal() { document.getElementById('auth-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('auth-modal').style.display = 'none'; }

        // Переключение между Входом и Регистрацией
        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('modal-title').innerText = isLoginMode ? "Вход" : "Регистрация";
            document.getElementById('btn-action').innerText = isLoginMode ? "Войти" : "Создать аккаунт";
            document.getElementById('btn-toggle').innerText = isLoginMode ? "Нет аккаунта? Зарегистрироваться" : "Уже есть аккаунт? Войти";
        }

        // Главная функция (Вход/Регистрация)
        function login() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;

            if(user === "" || pass === "") {
                alert("Заполните все поля!");
                return;
            }

            if(isLoginMode) {
                // ЛОГИКА ВХОДА
                let savedUser = localStorage.getItem('cherry_user');
                if(savedUser === user) {
                    alert("Успешный вход! Добро пожаловать, " + user);
                    unlockDownload();
                    closeModal();
                } else {
                    alert("Пользователь не найден. Зарегистрируйтесь!");
                }
            } else {
                // ЛОГИКА РЕГИСТРАЦИИ
                localStorage.setItem('cherry_user', user); // Сохраняем пользователя в браузере
                alert("Аккаунт " + user + " успешно создан!");
                unlockDownload();
                closeModal();
            }
        }

        // Функция разблокировки кнопки скачивания
        function unlockDownload() {
            document.getElementById('locked-area').style.display = 'none';
            document.getElementById('download-area').style.display = 'flex';
            
            // Меняем кнопку в меню на "Выйти"
            let loginLink = document.getElementById('login-link');
            loginLink.innerText = "Выйти";
            loginLink.onclick = function() {
                localStorage.removeItem('cherry_user');
                location.reload(); // Перезагружаем страницу
            };
        }
    </script>
</body>
</html>
